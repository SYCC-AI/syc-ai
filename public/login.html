<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020817">
  <title>Sign in — SYC-AI</title>
  <link rel="icon" href="/assets/syc-logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/assets/app.webmanifest">
  <script src="/i18n.js?v=19"></script>
  <link rel="stylesheet" href="/main.css?v=22">
  <link rel="stylesheet" href="/v2.css?v=6">
</head>
<body class="login-body">
  <div class="login-scene" aria-hidden="true">
    <div class="login-nebula login-nebula-one"></div>
    <div class="login-nebula login-nebula-two"></div>
    <div class="login-grid"></div>
    <div class="login-stars"></div>
    <div class="login-ring login-ring-one"></div>
    <div class="login-ring login-ring-two"></div>
  </div>

  <main class="login-shell">
    <form class="login-card" id="loginForm">
      <div class="login-card-shine" aria-hidden="true"></div>

      <div class="login-logo-stage" aria-hidden="true">
        <div class="login-halo"></div>
        <div class="login-orbit login-orbit-outer"></div>
        <div class="login-orbit login-orbit-inner"></div>
        <div class="login-logo-frame">
          <img src="/syc-logo.jpg" alt="">
        </div>
      </div>

      <p class="login-eyebrow"><span></span>SYC-AI<span></span></p>
      <h1 id="onboardingTitle">Welcome to SYC-AI</h1>
      <p class="login-subtitle" id="onboardingSubtitle">Your intelligent command center</p>

      <div class="login-fields" id="onboardingFields">
        <label class="login-field" for="username">
          <span class="login-field-label" data-i18n>Username</span>
          <span class="login-input-shell">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username" data-i18n-attr="placeholder" required autofocus>
          </span>
        </label>

        <label class="login-field" for="password">
          <span class="login-field-label" data-i18n>Password</span>
          <span class="login-input-shell">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v11H5V10Zm7 4v3"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" data-i18n-attr="placeholder" required>
            <button class="login-password-toggle" id="passwordToggle" type="button" aria-label="Show password" data-i18n-attr="aria-label" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
          </span>
        </label>

        <div id="otpMount"></div>


      </div>

      <button class="login-submit" type="submit" id="submit">
        <span id="submitLabel">Sign in</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <small id="error" role="alert" aria-live="polite"></small>

      <!-- Sign in with Google / GitHub: shown only for providers the service offers. -->
      <div class="login-oauth" id="oauthBox" hidden>
        <p class="login-oauth-or"><span data-i18n>or</span></p>
        <a class="login-oauth-btn" id="oauthGoogle" href="/api/onboarding/oauth/google/start" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.6 3.8-5.4 3.8-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12s4.3 9.6 9.6 9.6c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12z"/></svg>
          <span data-i18n>Continue with Google</span>
        </a>
        <a class="login-oauth-btn" id="oauthGithub" href="/api/onboarding/oauth/github/start" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.7.4-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .6 1.4.2 2.4.1 2.7.7.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 12 2.2z"/></svg>
          <span data-i18n>Continue with GitHub</span>
        </a>
      </div>

      <nav id="onboardingNav" aria-label="Account options">
        <button type="button" data-mode="signin" data-i18n>Sign in</button>
        <button type="button" data-mode="signup" data-i18n>Create account</button>
        <button type="button" data-mode="username" data-i18n>Recover username</button>
        <button type="button" data-mode="password" data-i18n>Reset password</button>
      </nav>

      <div class="login-secure"><i></i><span data-i18n>Secure, encrypted connection</span></div>
      <nav class="login-langs" aria-label="Language">
        <button type="button" data-set-lang="en">English</button><button type="button" data-set-lang="zh">中文</button><button type="button" data-set-lang="es">Español</button><button type="button" data-set-lang="ar">العربية</button><button type="button" data-set-lang="ru">Русский</button><button type="button" data-set-lang="fa">فارسی</button>
      </nav>
      <p class="login-legal"><a href="https://syc-ai.com/privacy" target="_blank" rel="noopener" data-i18n>Privacy</a> · <a href="https://syc-ai.com/terms" target="_blank" rel="noopener" data-i18n>Terms</a> · <a href="https://github.com/SYCC-AI/syc-ai" target="_blank" rel="noopener">GitHub</a></p>
    </form>
  </main>

  <script type="module" src="/login.js?v=7"></script>
</body>
</html>
