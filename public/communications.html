<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <title>SYC</title>
  <link rel="icon" href="/assets/syc-logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/assets/app.webmanifest">
  <script src="/i18n.js?v=19"></script>
  <link rel="stylesheet" href="/main.css?v=22">
  <link rel="stylesheet" href="/v2.css?v=5">
</head>
<body class="v2 connection-section">
  <div class="watermark" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <a class="back" href="/main" aria-label="Back" data-i18n-attr="aria-label">
        <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>
      </a>
      <div>
        <strong data-i18n>Communications</strong>
        <span data-i18n>Social accounts and messengers</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="avatar-menu" id="avatarMenu"></div>
    </div>
  </header>

  <main class="dash">
    <div class="grid">
      <div class="card locked" role="button" tabindex="0" data-soon>
        <span class="card-icon card-logo brand-instagram"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg></span>
        <b>Instagram</b>
        <small data-i18n>Direct messages and posts</small>
        <em data-i18n>Coming soon</em>
      </div>
      <div class="card locked" role="button" tabindex="0" data-soon>
        <span class="card-icon card-logo brand-tiktok"><svg viewBox="0 0 24 24" fill="none"><path d="M14 4v9.5a3.5 3.5 0 1 1-3-3.46"/><path d="M14 4c.5 2.4 2.2 3.9 5 4"/></svg></span>
        <b>TikTok</b>
        <small data-i18n>Account and messages</small>
        <em data-i18n>Coming soon</em>
      </div>
      <div class="card locked" role="button" tabindex="0" data-soon>
        <span class="card-icon card-logo brand-youtube"><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="m10.5 9.5 5 2.5-5 2.5Z"/></svg></span>
        <b>YouTube</b>
        <small data-i18n>Channel and comments</small>
        <em data-i18n>Coming soon</em>
      </div>
      <div class="card locked" role="button" tabindex="0" data-soon>
        <span class="card-icon card-logo brand-telegram"><svg viewBox="0 0 24 24" fill="none"><path d="M21 5 3.5 11.5l5 1.8L19 7.5l-8 7.4.3 4.1 2.6-3 3.6 2.6z"/></svg></span>
        <b>Telegram</b>
        <small data-i18n>Chats and channels</small>
        <em data-i18n>Coming soon</em>
      </div>
      <div class="card locked" role="button" tabindex="0" data-soon>
        <span class="card-icon card-logo brand-whatsapp"><svg viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12Z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.4-2-1-1 .9c-1-.5-1.8-1.3-2.3-2.3l.9-1-1-2Z" fill="currentColor" stroke="none"/></svg></span>
        <b>WhatsApp</b>
        <small data-i18n>Chats and contacts</small>
        <em data-i18n>Coming soon</em>
      </div>
    </div>
  </main>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="/theme.js?v=1"></script>
  <script src="/profile.js?v=6"></script>
  <script src="/communications.js?v=1"></script>
</body>
</html>
