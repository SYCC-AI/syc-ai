<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <title>Main panel — SYC</title>
  <link rel="icon" href="/assets/syc-logo.svg" type="image/svg+xml">
  <script src="/i18n.js?v=5"></script>
  <link rel="stylesheet" href="/main.css?v=9">
</head>
<body>
  <div class="ambient"></div>
  <div class="watermark" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-orb small">
        <svg viewBox="0 0 32 32"><path d="M16 3.5 27 9.8v12.4L16 28.5 5 22.2V9.8L16 3.5Z"/><path d="m11 13 5-3 5 3v6l-5 3-5-3v-6Z"/></svg>
      </div>
      <div>
        <strong>SYC</strong>
        <span data-i18n>Main panel</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="avatar-menu" id="avatarMenu"></div>
    </div>
  </header>

  <main class="dash">
    <h1 data-i18n>What should we work on?</h1>
    <p class="lede" data-i18n>Each section is part of the workspace. Empty ones are built over time.</p>
    <div class="grid" id="grid">
      <a class="card admin" href="/profage">
        <span class="card-icon"><svg viewBox="0 0 24 24"><path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8Z"/></svg></span>
        <b data-i18n>Professional accounts</b>
        <small data-i18n>Codex, Kimi, Claude, Gemini and more</small>
      </a>
      <a class="card" href="/connection">
        <span class="card-icon"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg></span>
        <b data-i18n>Connection</b>
        <small data-i18n>Phone, Windows and Linux connections</small>
      </a>
      <a class="card" href="/communications">
        <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-12.9 6.3L3 20l1.7-4.6A8 8 0 1 1 21 12Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></span>
        <b data-i18n>Communications</b>
        <small data-i18n>Instagram, TikTok, YouTube, Telegram and WhatsApp</small>
        <em data-i18n>Panel upgrade</em>
      </a>
    </div>
  </main>

  <script src="/theme.js?v=1"></script>
  <script src="/profile.js?v=3"></script>
  <script src="/main.js?v=3"></script>
</body>
</html>
